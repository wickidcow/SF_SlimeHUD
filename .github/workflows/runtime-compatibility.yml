name: Runtime Compatibility

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  SLIMEFUN_VERSION: '4.1.59'

jobs:
  build-candidate:
    name: Build runtime candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build Java 21-compatible addon JAR
        run: mvn -B -ntp clean package

      - name: Verify drop-in filename
        run: test -s target/SF_SlimeHUD2.0.2.jar

      - name: Upload raw runtime candidate
        uses: actions/upload-artifact@v7
        with:
          name: SF_SlimeHUD2.0.2.jar
          path: target/SF_SlimeHUD2.0.2.jar
          archive: false
          if-no-files-found: error

  runtime:
    name: ${{ matrix.label }}
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - label: Paper 1.21.11 / Java 21
            family: paper
            minecraft: 1.21.11
            channel: ANY
            java: 21
            advisory: false
            expectation: supported
          - label: Purpur 1.21.11 / Java 21
            family: purpur
            minecraft: 1.21.11
            channel: ANY
            java: 21
            advisory: false
            expectation: supported
          - label: Leaf 1.21.11 / Java 21
            family: leaf
            minecraft: 1.21.11
            channel: ANY
            java: 21
            advisory: false
            expectation: supported
          - label: Folia 1.21.11 / Java 21
            family: folia
            minecraft: 1.21.11
            channel: ANY
            java: 21
            advisory: true
            expectation: supported

          - label: Paper 26.1.2 / Java 25
            family: paper
            minecraft: 26.1.2
            channel: STABLE
            java: 25
            advisory: false
            expectation: supported
          - label: Purpur 26.1.2 / Java 25
            family: purpur
            minecraft: 26.1.2
            channel: ANY
            java: 25
            advisory: false
            expectation: supported
          - label: Leaf 26.1.2 / Java 25
            family: leaf
            minecraft: 26.1.2
            channel: ANY
            java: 25
            advisory: true
            expectation: supported
          - label: Folia 26.1.2 / Java 25
            family: folia
            minecraft: 26.1.2
            channel: STABLE
            java: 25
            advisory: false
            expectation: supported

          - label: Paper 26.2 / Java 25
            family: paper
            minecraft: 26.2
            channel: STABLE
            java: 25
            advisory: false
            expectation: supported
          - label: Purpur 26.2 / Java 25
            family: purpur
            minecraft: 26.2
            channel: ANY
            java: 25
            advisory: false
            expectation: supported
          - label: Leaf 26.2 / Java 25
            family: leaf
            minecraft: 26.2
            channel: ANY
            java: 25
            advisory: false
            expectation: supported
          - label: Folia 26.2 / Java 25
            family: folia
            minecraft: 26.2
            channel: ANY
            java: 25
            advisory: false
            expectation: supported

          - label: Paper 26.3 / Java 25
            family: paper
            minecraft: 26.3
            channel: ANY
            java: 25
            advisory: false
            expectation: supported

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Download runtime candidate
        uses: actions/download-artifact@v8
        with:
          name: SF_SlimeHUD2.0.2.jar
          path: build/runtime-candidate

      - name: Resolve runtime candidate
        id: addon
        shell: bash
        run: |
          JAR="$(find build/runtime-candidate -name 'SF_SlimeHUD2.0.2.jar' -print -quit)"
          test -n "$JAR"
          test -s "$JAR"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Boot with Slimefun Legacy on ${{ matrix.label }}
        run: |
          chmod +x scripts/runtime_smoke.sh
          bash scripts/runtime_smoke.sh \
            "${{ matrix.family }}" \
            "${{ matrix.minecraft }}" \
            "${{ matrix.channel }}" \
            "${{ steps.addon.outputs.jar }}" \
            "build/runtime-smoke-${{ matrix.family }}-${{ matrix.minecraft }}" \
            "${{ matrix.expectation }}"

      - name: Publish runtime evidence
        if: always()
        shell: bash
        run: |
          RESULT="build/runtime-smoke-${{ matrix.family }}-${{ matrix.minecraft }}/smoke-result.txt"
          BUILD="build/runtime-smoke-${{ matrix.family }}-${{ matrix.minecraft }}/server-build.txt"
          {
            echo "## ${{ matrix.label }}"
            echo
            if [[ -f "$RESULT" ]]; then
              echo '```text'
              cat "$RESULT"
              echo '```'
            elif [[ -f "$BUILD" ]]; then
              echo '**Result:** runtime smoke did not complete successfully.'
              echo
              echo '```text'
              cat "$BUILD"
              echo '```'
            else
              echo '**Result:** runtime target could not be resolved or started.'
            fi
            if [[ "${{ matrix.advisory }}" == "true" ]]; then
              echo
              echo '_Advisory target: failure is reported but does not block the PR._'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
