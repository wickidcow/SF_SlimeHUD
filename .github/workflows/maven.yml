name: Build SF_SlimeHUD

on:
  push:
    branches:
      - master
      - 'upgrade/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java ${{ matrix.java }} build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Verify exact artifact name
        run: test -f target/SF_SlimeHUD2.0.1.jar

      - name: Upload JAR
        if: matrix.java == 25
        uses: actions/upload-artifact@v4
        with:
          name: SF_SlimeHUD2.0.1.jar
          path: target/SF_SlimeHUD2.0.1.jar
          if-no-files-found: error
          retention-days: 30
