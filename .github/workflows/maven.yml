name: Build SF_SlimeHUD

on:
  push:
    branches:
      - master
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }} / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Paper 1.21.11 baseline
            java: 21
            paper: 1.21.11-R0.1-SNAPSHOT
            artifact: false
          - label: Paper 1.21.11 on Java 25
            java: 25
            paper: 1.21.11-R0.1-SNAPSHOT
            artifact: true
          - label: Paper 26.1.2 stable API
            java: 25
            paper: 26.1.2.build.74-stable
            artifact: false
          - label: Paper 26.2 stable API
            java: 25
            paper: 26.2.build.123-stable
            artifact: false
          - label: Paper 26.3 current pre-release API
            java: 25
            paper: 26.3-rc-3.build.1-alpha
            artifact: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build against ${{ matrix.paper }}
        run: mvn -B -ntp -Dpaper.version="${{ matrix.paper }}" clean package

      - name: Verify drop-in filename
        run: test -s target/SF_SlimeHUD2.0.1.jar

      - name: Upload raw JAR
        if: matrix.artifact
        uses: actions/upload-artifact@v7
        with:
          name: SF_SlimeHUD2.0.1.jar
          path: target/SF_SlimeHUD2.0.1.jar
          archive: false
          if-no-files-found: error

      - name: Publish canonical GitHub Release JAR
        if: matrix.artifact && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v2.0.1'
          JAR='target/SF_SlimeHUD2.0.1.jar'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r OLD; do
              if [[ "$OLD" == *.jar && "$OLD" != 'SF_SlimeHUD2.0.1.jar' ]]; then
                gh release delete-asset "$TAG" "$OLD" --repo "$GITHUB_REPOSITORY" -y
              fi
            done < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release upload "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'SF_SlimeHUD 2.0.1' \
              --notes 'SF_SlimeHUD 2.0.1: Slimefun Legacy + WIT-style HUD modernization for Minecraft 1.21.11 through 26.3 compatibility.'
          fi
