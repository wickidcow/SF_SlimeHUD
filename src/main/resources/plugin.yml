name: SF_SlimeHUD
version: ${project.version}
main: io.github.schntgaispock.slimehud.SlimeHUD
api-version: '1.21'
folia-supported: true
author: wickidcow
description: Slimefun Legacy and vanilla WAILA-style HUD with per-player BossBar or ActionBar display.
website: https://github.com/wickidcow/SF_SlimeHUD

depend:
  - Slimefun
softdepend:
  - PlaceholderAPI

commands:
  slimehud:
    description: Toggle and configure the SF_SlimeHUD display.
    aliases: [sfhud, sfh]
    usage: /slimehud <toggle|display|status>

permissions:
  slimehud.toggle:
    description: Toggle the HUD on or off.
    default: true
  slimehud.display:
    description: Choose BossBar or ActionBar display mode.
    default: true
