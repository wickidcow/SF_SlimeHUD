options:
  placeholder-api-support: true

waila:
  # Master switch.
  disabled: false

  # Players start with the HUD enabled unless they have saved a preference.
  enabled-by-default: true

  # Worlds where the HUD is hidden.
  disabled-in: []

  # Default player display. Existing configs using "location" are still read as a fallback.
  # Valid: bossbar, actionbar
  default-display: bossbar
  location: bossbar

  # Maximum look distance in blocks.
  range: 6.0

  # Update rate in game ticks. 10 = twice per second.
  tick-rate: 10

  # Keep Slimefun/legacy color codes in HUD text.
  use-original-colors: true

  # Boss bar color: inherit, white, red, yellow, green, blue, purple, pink.
  bossbar-color: inherit

  slimefun:
    show-cargo-size: true
    show-cargo-channel: true
    show-energy-size: true
    show-energy-stored: true
    show-machine-progress: true
    show-generator-generation: true

  vanilla:
    # Generic Material-based lookup means new vanilla blocks work without a hardcoded item list.
    enabled: true
    show-container-fill: true
    show-redstone: true
    show-block-state: true
    show-tool-hint: true
    show-hardness: true

  entities:
    enabled: true
    show-health: true
    show-villager-info: true
    show-item-stack: true
